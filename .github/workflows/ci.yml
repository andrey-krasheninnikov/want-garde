name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal --component clippy --component rustfmt
      - name: Dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Formatting
        run: |
          cargo fmt --all --check
          npm run format:check
      - name: Rust checks
        run: |
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Contracts and versions
        run: |
          cargo xtask contracts --check
          cargo xtask versions
      - name: Frontend types
        run: npm run check
      - name: Tests
        run: |
          cargo test --workspace --locked
          npm test
      - name: Builds
        run: |
          cargo build --workspace --release --locked
          npm run build
      - name: Clean tracked state
        run: git diff --exit-code
      - name: Package development installation
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p target/installation
          install -m 755 target/release/want-garde target/release/want-garde-daemon target/release/want-garde-helper target/installation/
          cp packaging/systemd/want-garde.service packaging/systemd/want-garde-helper.socket packaging/systemd/want-garde-helper@.service packaging/systemd/want-garde-listeners.socket packaging/systemd/want-garde-listeners@.service packaging/systemd/want-garde-xui.socket packaging/systemd/want-garde-xui@.service examples/config.json examples/xui-read-policy.json target/installation/
          printf '%s\n' "$SOURCE_SHA" > target/installation/revision
          (cd target/installation && sha256sum want-garde want-garde-daemon want-garde-helper want-garde.service want-garde-helper.socket want-garde-helper@.service want-garde-listeners.socket want-garde-listeners@.service want-garde-xui.socket want-garde-xui@.service config.json xui-read-policy.json revision > SHA256SUMS)
          tar -czf target/want-garde-linux-x86_64.tar.gz -C target/installation .
          (cd target && sha256sum want-garde-linux-x86_64.tar.gz > want-garde-linux-x86_64.tar.gz.sha256)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-x86_64-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            target/want-garde-linux-x86_64.tar.gz
            target/want-garde-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 3
