[package]
name = "garde-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "want-garde-daemon"
path = "src/main.rs"

[dependencies]
garde-config = { path = "../../crates/config" }
garde-contracts.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio = { version = "1.54", features = ["rt", "macros", "time", "signal", "sync", "process", "io-util", "net"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rustix = { version = "1.1", features = ["fs", "process"] }
garde-entrypoint = { path = "../../crates/entrypoint" }
sha2 = "0.10"
regex = "1.13"
rusqlite = { version = "0.41.1", features = ["bundled"] }

[lints]
workspace = true


[dev-dependencies]
tempfile = "3"
