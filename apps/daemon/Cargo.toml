[package]
name = "garde-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "want-garde-daemon"
path = "src/main.rs"

[dependencies]
garde-config = { path = "../../crates/config" }
garde-contracts.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio = { version = "1.54", features = ["rt", "macros", "time", "signal", "sync", "process", "io-util", "net"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls", "socks"] }
percent-encoding = "2.3.2"
rustls = { version = "0.23", default-features = false }
rustix = { version = "1.1", features = ["fs", "process"] }
garde-entrypoint = { path = "../../crates/entrypoint" }
sha2 = "0.10"
regex = "1.13"
rusqlite = { version = "0.41.1", features = ["bundled"] }

[target.'cfg(target_os = "linux")'.dependencies]
hickory-proto = "0.26.3"
socket2 = { version = "0.6", features = ["all"] }

[lints]
workspace = true


[dev-dependencies]
garde-xui = { path = "../../crates/xui" }
tempfile = "3"
