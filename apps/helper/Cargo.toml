[package]
name = "garde-helper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "want-garde-helper"
path = "src/main.rs"

[dependencies]
garde-xui = { path = "../../crates/xui" }
garde-entrypoint = { path = "../../crates/entrypoint" }
