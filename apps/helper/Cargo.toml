serde_json.workspace = true
chrono.workspace = true
garde-config = { path = "../../crates/config" }
rustix = { version = "1.1", features = ["process"] }
tokio = { version = "1.54", features = ["rt", "macros", "process", "time", "net", "io-util"] }

[lints]
workspace = true
